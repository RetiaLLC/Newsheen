; Newsheen Simple LED Remote — standalone IR-remote LED controller for the Newsheen board.
; IR receiver (VS1838B) on GPIO4, 8x WS2812B on GPIO16.
;   Build:  pio run -e newsheen-led-remote
;   A pre-merged factory image is in dist/newsheen-simple-led-remote.factory.bin
[env:newsheen-led-remote]
platform = https://github.com/tasmota/platform-espressif32/releases/download/2024.06.00/platform-espressif32.zip
framework = arduino
board = esp32-s3-devkitc-1
board_build.arduino.memory_type = qio_qspi
board_build.flash_mode = qio
board_build.f_flash = 80000000L
board_upload.flash_size = 16MB
monitor_speed = 115200
lib_deps =
  crankyoldgit/IRremoteESP8266 @ ^2.8.6
  adafruit/Adafruit NeoPixel @ ^1.12.3
build_flags =
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
